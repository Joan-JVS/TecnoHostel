spring.application.name=tecnohostal
server.port=8080

# Base de dades H2 en memòria: es crea quan arrenca l'aplicació i desapareix quan s'atura.
spring.datasource.url=jdbc:h2:mem:tecnohostal;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Consola web d'H2: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:tecnohostal)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Executa schema.sql (taules) i data.sql (dades inicials) a cada arrencada
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
